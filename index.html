<style>

.tmrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}

.sheet{position:absolute;left:0;right:0;bottom:58px;height:68%;background:var(--bg);border-top:2px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column;z-index:5;box-shadow:0 -8px 24px #0009}

.shb{flex:1;overflow-y:auto;padding:8px 10px}
button,select,input{font:inherit;color:var(--fg)}
button{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:6px 12px;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}.bar span{color:var(--mut);font-size:12px;margin-right:auto}

.st{color:var(--mut);font-size:12px}.sk{font-size:12px}.sk u{text-decoration:none;color:var(--acc)}
.bt{display:flex;flex-direction:column;gap:4px}.bt button{min-width:80px;padding:5px 8px;font-size:12px;white-space:pre}.hero.lock{opacity:.5}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.gc .row{display:flex;gap:8px;justify-content:center;margin:10px 0}.gc .row button{flex:1;padding:10px;font-weight:600;background:var(--gold);border-color:var(--gold);color:#2a2000;white-space:pre}

.rg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}

.note{font-size:12px;color:var(--mut)}
.f{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}.f label{font-size:12px;color:var(--mut)}
.f input[type=number]{width:58px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}.f select{padding:5px;border:1px solid var(--line);border-radius:8px;background:var(--card2)}
.hid{display:none!important}
nav button{position:relative}.nd{position:absolute;top:4px;right:28%;width:9px;height:9px;border-radius:50%;background:#ff3b3b}
#tt{position:absolute;left:8px;right:8px;bottom:66px;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:20}
.scr{position:absolute;left:0;right:0;top:0;bottom:58px;background:var(--bg);z-index:6;display:flex;flex-direction:column}
.hbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#10163a;border-bottom:1px solid var(--line);font-size:13px;gap:8px}
.hbar b{color:var(--gold)}.hbar button{padding:2px 9px;border-radius:50%;font-size:12px}
.hbody{flex:1;min-height:0;display:flex;flex-direction:column}#vg{flex:1;overflow-y:auto}
#vd:not(.hid){flex:1;min-height:0;display:flex;flex-direction:column}
.htabs{display:flex;margin:6px 10px;background:#10163a;border:1px solid var(--line);border-radius:20px;padding:3px}
.htabs button{flex:1;border:0;background:transparent;border-radius:16px;padding:6px 0;font-size:13px;color:var(--mut)}
.htabs button.on{background:var(--card2);color:var(--fg);box-shadow:inset 0 0 0 2px #cfe4ff}
.gbar,.gbar2{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:13px}.gbar{justify-content:space-between}
.gbar2 span{color:var(--mut);font-size:12px}.gbar2 select{flex:1;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--card2)}
#vform{padding:6px 10px 0}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 10px 12px}
.hc{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:linear-gradient(#323c78,#171c40)}
.hc.SSR{border-color:#ff9a3d}.hc.SR{border-color:#b05cd6}.hc.lock{opacity:.5}
.hc canvas{width:100%;aspect-ratio:1;display:block}
.hc .ri{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#000a;font-size:10px;font-style:normal;display:grid;place-items:center}
.hc .lv{position:absolute;top:2px;right:3px;font-size:10px;text-shadow:0 0 3px #000}

.hc .nm{text-align:center;font-size:11px;padding:1px 0;white-space:nowrap;overflow:hidden}
.hc .stars{text-align:center;font-size:9px;color:var(--gold);letter-spacing:-1px;line-height:1.1}
.hc .sbar{position:relative;height:12px;background:#000a;margin:2px}.hc .sbar u{position:absolute;left:0;top:0;bottom:0;background:#2fb7cc;width:0}
.hc .sbar span{position:relative;font-size:9px;display:block;text-align:center;line-height:12px}
.hc .dot{position:absolute;top:18px;right:3px;width:8px;height:8px;border-radius:50%;background:#ff3b3b}
.art{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at 50% 30%,#3c3158 0,#1a1330 55%,#0b0a1c 100%);overflow:hidden}
#big{position:absolute;left:50%;top:9%;height:91%;aspect-ratio:300/360;transform:translateX(-50%)}
.tl{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:6px}
.ch{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.ch i{width:26px;height:26px;border-radius:50%;background:#5a2e3a;border:2px solid #d9a0a8;display:grid;place-items:center;font-style:normal;font-size:13px}
.rb{position:absolute;top:4px;left:50%;transform:translateX(-50%);text-align:center;font-weight:700;font-size:13px;color:var(--gold);text-shadow:0 0 8px #ff9a3d}.rb .gem{font-size:32px;line-height:1}
.rb.SR{color:#c493ff;text-shadow:0 0 8px #8a4bd6}
.ar{position:absolute;top:42%;width:36px;height:36px;border-radius:50%;padding:0;font-size:20px;background:#3a4a8acc}.ar.l{left:6px}.ar.r{right:6px}
.qm{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;padding:0;font-size:17px;font-weight:700}
.plat{position:absolute;left:4px;bottom:52px;width:112px;height:84px;background:radial-gradient(ellipse at 50% 88%,#59adff 0,#2467d6 38%,transparent 70%)}.plat canvas{width:100%;height:100%}
.abot{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center}
.skrow{display:flex;gap:8px;margin-bottom:2px}.skb{width:46px;height:46px;border-radius:6px;border:2px solid #8892c8;background:#1b2250;padding:0;font-size:22px;position:relative}
.skb small{position:absolute;bottom:0;left:0;right:0;font-size:9px;background:#000a;line-height:12px}.skb.on{border-color:var(--gold)}
.dstars{color:var(--gold);font-size:14px;letter-spacing:2px;text-shadow:0 1px 2px #000}
.np{display:flex;gap:8px;width:100%;padding:0 10px 8px;align-items:stretch}
.npl{flex:1;background:#2b3a78cc;border:2px solid #6b7ac0;border-radius:6px;text-align:center;padding:2px 6px}.npl b{font-size:15px}.npl div{display:flex;justify-content:space-between;font-size:13px}
.np button{width:56px;font-size:20px;padding:0;background:#2a6fd0;border-color:#5aa0ff}
.dinfo{background:#1c2a58;text-align:center;padding:8px;font-size:13px;font-weight:600;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:38px}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px 4px}
.dstats div{background:#10163a;border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between}
.dact{display:grid;grid-template-columns:54px 1fr 1.25fr 54px;gap:6px;padding:4px 10px 4px}
.dact button{padding:8px 4px;font-weight:700;white-space:pre;line-height:1.2;font-size:13px}
.dact .lvb{background:#f5d776;border-color:#f5d776;color:#3a2a00}.dact button:disabled{background:#4a4f66;border-color:#4a4f66;color:#a8adc0;opacity:1}

/* ====== UI v2：特摄指挥台风格（覆盖层） ====== */
:root{--bg:#090c15;--card:#121827;--card2:#1b2335;--line:#2a3550;--fg:#eef2fb;--mut:#8591ad;--acc:#ff4a3a;--gold:#ffc857;--cy:#3fd0ff;--glass:rgba(9,13,24,.64);--hair:rgba(255,255,255,.12);--ssr:#ffc857;--sr:#b69cff}
body{background:#04060b;font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;letter-spacing:.2px}
.app{background:radial-gradient(120% 60% at 50% 100%,#141b30 0,#090c15 70%)}
b,.sb .stn b,#cp,.chips{font-variant-numeric:tabular-nums}
.pl,.sb,.pill,.ln{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--hair);box-shadow:0 4px 14px #0006}
.pl{border-radius:4px 16px 4px 16px;padding:5px 14px 5px 5px}
.pl canvas{border-radius:4px 12px 4px 12px;background:linear-gradient(#2a3556,#141a2e);border:1px solid var(--hair)}
.pn{font-size:13px;font-weight:800;letter-spacing:.5px}.pn span{color:var(--gold);font-weight:700}.ps{color:var(--cy);font-size:11px;letter-spacing:1px}
.sb{width:140px;border-radius:16px 4px 16px 4px;padding:7px 10px 8px}
.sb .stn{font-size:11px;letter-spacing:2px;color:var(--mut)}.sb .stn b{font-size:24px;font-weight:900;color:#fff;margin:0 3px;text-shadow:0 0 12px #3fd0ff66}
.wp{height:5px;border:0;background:#ffffff1c;margin:4px 0 3px}.wp i{background:linear-gradient(90deg,var(--cy),var(--gold));box-shadow:0 0 8px #3fd0ff88;border-radius:3px}
.wv{font-size:10.5px;letter-spacing:1px}
.chips{gap:5px;margin-top:6px}.chips span{display:flex;align-items:center;gap:5px;flex:1;justify-content:center;background:#ffffff12;border:1px solid #ffffff10;border-radius:8px;padding:3px 4px;font-size:12.5px;font-weight:800}
.ic{display:inline-block;width:13px;height:13px;vertical-align:-2px;flex:none}
.ic.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc857 45%,#c98a14);box-shadow:inset 0 0 0 2px #e0a52e,0 0 6px #ffc85766}

.pill{border-radius:3px 12px 3px 12px;padding:5px 12px;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--fg)}
.pill.on{color:var(--cy);border-color:#3fd0ff77;background:linear-gradient(#3fd0ff1f,#3fd0ff08),var(--glass)}
#bossBtn{background:linear-gradient(#ff6a4a,#e5311f);border:1px solid #ffb09a88;box-shadow:0 0 16px #ff4a3a77,0 4px 12px #0007;animation:bp 1.6s ease-in-out infinite}
@keyframes bp{50%{box-shadow:0 0 26px #ff4a3acc,0 4px 12px #0007}}
.ln{border:1px solid var(--hair);border-left:3px solid var(--cy);border-radius:3px 10px 3px 10px;padding:4px 10px}
.dock{background:linear-gradient(#0f1524ee,#090c15);border-top:1px solid var(--hair);padding:8px 8px 6px}
.dk-top{margin-bottom:7px}.dk-top button{background:transparent;border:1px solid var(--hair);color:var(--mut);border-radius:10px;padding:3px 11px;font-size:11.5px}
#cp{color:var(--gold);font-weight:900;letter-spacing:1px;font-size:13px;text-shadow:0 0 10px #ffc85744}
.tm{background:linear-gradient(#1a2237,#0f1523);border:1px solid var(--hair);border-radius:4px 12px 4px 12px;padding:4px 3px 5px;position:relative;overflow:hidden}
.tm:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#ffffff40,transparent)}
.tm .b{height:4px;border-radius:2px;background:#ffffff18;margin:3px 4px 0}.hpb i{background:linear-gradient(90deg,#2fd27a,#7bf0a6)}.cdb i{background:linear-gradient(90deg,#1b7fd6,var(--cy))}
.tm small{font-size:10px;font-weight:700;letter-spacing:.5px}
nav{background:#070a12;border-top:1px solid var(--hair);padding-bottom:2px}

const bcapF=()=>(Math.floor(Math.min(S.bs.a,S.bs.d,S.bs.h)/1000)+1)*1000;
const bcost=l=>40*Math.pow(1.011,l),bsum=(l,n)=>bcost(l)*(Math.pow(1.011,n)-1)/.011;

function bBuy(k){const n=bN(k),c=bsum(S.bs[k],n);if(n>0&&S.coins>=c){S.coins-=c;S.bs[k]+=n;save();ui()}}

 document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('on',b.dataset.b==bmult));
 const h=BN3.map(([k,nm,ic])=>{const l=S.bs[k],n=bN(k),c=n?bsum(l,n):0,ok=n&&S.coins>=c,lb='升级'+(n>1?' ×'+n:'')+'<br>'+fmt(c)+' 金币';
  return '<div class="it"><div><b>'+ic+' '+nm+' Lv.'+l+' / '+cp+'</b><div class="note">全队'+nm.replace('力','')+' +'+fmt(l*BA[k]*100)+'%'+(n?' → +'+fmt((l+n)*BA[k]*100)+'%':'')+'</div><div class="pg"><i style="width:'+(l-lo)/10+'%"></i></div></div><button '+(!n?'disabled>本段已满':(ok?'onclick="bBuy(\''+k+'\')"':'disabled')+'>'+lb)+'</button></div>'}).join('');

 $('dpsT').textContent={d:'总伤害',h:'总治疗/护盾',t:'总承伤'}[dpsK]+' '+fmt(tot)+' · '+fmt(tot/sec)+'/秒 · 战斗 '+Math.round(Rr.s)+'秒';
